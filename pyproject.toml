[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolescout"
dynamic = ["version"]
description = "Local job-search tool: fetches open roles from ATS job boards (Greenhouse, Lever, Ashby, Workday)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# The MCP server (rolescout serve). The scraper and the scheduled job do not need it.
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "mcp>=2.3,<3"]

[project.scripts]
rolescout = "rolescout.cli:main"

[project.urls]
Repository = "https://github.com/michaophir/rolescout-scraper"

[tool.hatch.version]
path = "src/rolescout/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rolescout"]

[tool.pytest.ini_options]
# Only collect the package tests. test_ats_fields.py at the repo root is a
# manual script that hits live APIs and must not be picked up by pytest.
testpaths = ["tests"]
